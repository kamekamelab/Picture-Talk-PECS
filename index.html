<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Picture Talk PECS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="title">Picture Talk PECS</div>
      <div id="phaseLabel" class="subtitle"></div>
    </div>
    <button id="teacherBtn" class="teacher">先生用</button>
  </header>

  <main>
    <div id="instruction" class="instruction"></div>

    <section id="bookArea" class="book">
      <div id="categoryTabs" class="tabs"></div>
      <div id="cards" class="cards"></div>
    </section>

    <section id="stripArea" class="strip-area hidden">
      <div class="strip-label">Sentence Strip</div>
      <div id="sentenceStrip" class="sentence-strip"></div>
    </section>

    <section id="exchangeArea" class="exchange-area">
      <div class="exchange-title">交換するところ</div>
      <div id="exchangeZone" class="exchange-zone">
        <span id="exchangeHint">ここに カードを おこう</span>
      </div>
      <button id="giveBtn" class="give" disabled>相手に わたす</button>
    </section>
  </main>
</div>

<div id="partnerModal" class="modal hidden">
  <div class="panel partner-panel">
    <div class="small">相手に見せる画面</div>
    <div id="partnerVisual" class="partner-visual"></div>
    <div id="partnerText" class="partner-text"></div>
    <button id="receivedBtn" class="received">受け取った</button>
    <button id="cancelPartnerBtn" class="secondary">もどる</button>
  </div>
</div>

<div id="recordModal" class="modal hidden">
  <div class="panel">
    <h2>交換できました</h2>
    <p>先生が今回の様子を記録してください。</p>
    <div class="record-grid">
      <button data-record="independent" class="record independent">自分からできた</button>
      <button data-record="assist" class="record assist">手助けあり</button>
    </div>
    <button id="skipRecordBtn" class="secondary">記録しない</button>
  </div>
</div>

<div id="successModal" class="modal hidden">
  <div class="panel success-panel">
    <div class="success-icon">✓</div>
    <div class="success-title">つたわった！</div>
    <div id="successText"></div>
    <button id="againBtn" class="give">もういちど</button>
  </div>
</div>

<div id="teacherModal" class="modal hidden">
  <div class="panel">
    <h2>先生用設定</h2>

    <label>学習段階
      <select id="phaseSelect">
        <option value="1">Phase 1：1枚を交換する</option>
        <option value="2">Phase 2：自分から相手へ届ける</option>
        <option value="3">Phase 3：複数から選んで交換する</option>
        <option value="4">Phase 4：Sentence Stripで文を作る</option>
      </select>
    </label>

    <label>Phase 3・4 のカード枚数
      <select id="cardCount">
        <option value="2">2枚</option>
        <option value="4">4枚</option>
        <option value="6">6枚</option>
        <option value="8">8枚</option>
      </select>
    </label>

    <label>Phase 1・2 で使うカード
      <select id="singleCardSelect"></select>
    </label>

    <label class="check"><input id="speechToggle" type="checkbox"> 交換時に読み上げる</label>

    <h3>今日の記録</h3>
    <div class="stats">
      <div><b id="independentCount">0</b><span>自分から</span></div>
      <div><b id="assistCount">0</b><span>手助けあり</span></div>
      <div><b id="sentCount">0</b><span>交換成立</span></div>
    </div>

    <div class="actions">
      <button id="resetStatsBtn" class="secondary">記録をリセット</button>
      <button id="closeTeacherBtn" class="give">閉じる</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
