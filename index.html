<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Picture Talk PECS</title><link rel='stylesheet' href='style.css'></head><body><div class='app'><header class='top'><div><div class='title'>Picture Talk PECS</div><div class='subtitle'>えらぶ → つたえる → つたわる</div></div><button id='teacherBtn' class='teacher'>先生用</button></header><section class='phase'><button data-phase='1'>Phase 1<br><span>1まいで つたえる</span></button><button data-phase='2'>Phase 2<br><span>じぶんから とどける</span></button><button data-phase='3'>Phase 3<br><span>えらんで つたえる</span></button></section><section class='message'><div class='message-label'>つたえたいもの</div><div id='selected' class='selected empty'>カードを えらんでね</div><button id='sendBtn' class='send' disabled>相手に つたえる</button></section><main><div id='instruction' class='instruction'></div><div id='cards' class='cards'></div></main><footer class='footer'><button id='helpBtn' class='record assist'>手助けあり</button><button id='independentBtn' class='record independent'>自分からできた</button></footer></div><div id='partnerModal' class='modal hidden'><div class='panel partner-panel'><div class='small'>相手に見せる画面</div><div id='partnerCard' class='partner-card'></div><div id='partnerText' class='partner-text'></div><button id='understoodBtn' class='understood'>わかったよ</button><button id='cancelPartnerBtn' class='secondary'>もどる</button></div></div><div id='successModal' class='modal hidden'><div class='panel success-panel'><div class='success-icon'>✓</div><div class='success-title'>つたわった！</div><div id='successText'></div><button id='againBtn' class='send'>もういちど</button></div></div><div id='teacherModal' class='modal hidden'><div class='panel'><h2>先生用設定</h2><label>使うPhase<select id='phaseSelect'><option value='1'>Phase 1</option><option value='2'>Phase 2</option><option value='3'>Phase 3</option></select></label><label>Phase 3 のカード枚数<select id='cardCount'><option value='2'>2枚</option><option value='4'>4枚</option><option value='6'>6枚</option><option value='8'>8枚</option></select></label><label class='check'><input id='speechToggle' type='checkbox'> 相手に伝える時に読み上げる</label><h3>今日の記録</h3><div class='stats'><div><b id='independentCount'>0</b><span>自分から</span></div><div><b id='assistCount'>0</b><span>手助けあり</span></div><div><b id='sentCount'>0</b><span>伝えた回数</span></div></div><div class='actions'><button id='resetStatsBtn' class='secondary'>記録をリセット</button><button id='closeTeacherBtn' class='send'>閉じる</button></div></div></div><script src='app.js'></script></body></html>
